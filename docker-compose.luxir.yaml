#ddev-generated
services:
  luxir:
    container_name: ddev-${DDEV_SITENAME}-luxir
    image: ddev-luxir:${LUXIR_VERSION:-0.1.0}-${DDEV_SITENAME}-built
    build:
      context: ./luxir
      args:
        LUXIR_VERSION: ${LUXIR_VERSION:-0.1.0}
    platform: linux/amd64
    restart: "no"
    expose:
      - "9400"
    environment:
      LUXIR_CPU_TIER: ${LUXIR_CPU_TIER:-auto}
      LUXIR_MAX_RAM_MB: ${LUXIR_MAX_RAM_MB:-512}
      LUXIR_LOG_LEVEL: ${LUXIR_LOG_LEVEL:-info}
      LUXIR_EXTRA_ARGS: ${LUXIR_EXTRA_ARGS:-}
      VIRTUAL_HOST: $DDEV_HOSTNAME
      HTTP_EXPOSE: 9400:9400
      HTTPS_EXPOSE: 9443:9400
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - luxir:/var/lib/luxir
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9400/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  luxir:
